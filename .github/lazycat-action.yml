version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/cloudfalred-web.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: cloudfalred-web

build:
  run_buildscript: false

images:
  # 上游 wisdomsky/cloudflared-web 为日历三段 SemVer（2023.10.0 ~ 2026.9.1），latest 不匹配正则
  - id: cloudfalred-web
    target: service
    service: cloudfalred-web
    source: wisdomsky/cloudflared-web
    channel: stable
    sort: semver
    tag_regex: '^v?\d+\.\d+\.\d+$'
    delivery:
      mode: mirror

stores:
  official:
    # Official store publication is intentionally disabled; publish only to Miaomiao Store.
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Cloudflared
    summary: "带 Web 管理界面的 Cloudflare Tunnel 客户端"
